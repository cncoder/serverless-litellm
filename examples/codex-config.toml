# Codex CLI 接入 GPT-5.6（Bedrock Mantle）—— 经 LiteLLM 网关，已实测跑通
#
# ★ 关键（2026-07-27 实测）：Codex 0.145 对 gpt-5.6 默认走 "responses-lite" 协议变体，
#   请求会带 additional_tools / reasoning.context=all_turns / x-openai-internal-codex-responses-lite
#   等私有字段，LiteLLM/Mantle 不认 → 报 "stream disconnected / high demand"。
#   解法：给 codex 一份 use_responses_lite=false 的 model catalog，让它发标准 Responses 请求。
#   实测：纯文本 + 真实 shell 工具调用（printf → 读 stdout）均通过。
#
# 部署前准备（在要跑 codex 的机器执行一次）：
#   1) 装 codex：curl -fsSL https://chatgpt.com/codex/install.sh | sh
#   2) 生成禁用 responses-lite 的 catalog（需 jq）：
#      mkdir -p ~/.codex
#      curl -fsSL https://raw.githubusercontent.com/openai/codex/rust-v0.145.0/codex-rs/models-manager/models.json \
#        | jq '[.models[] | if (.slug|startswith("gpt-5.6")) then .use_responses_lite=false else . end] as $m | .models=$m' \
#        > ~/.codex/models-standard-responses.json
#   3) 用下面的 config.toml（model_catalog_json 用绝对路径）
#   4) export OPENAI_API_KEY="<master-key>" 后运行 codex

model = "gpt-5.6-terra"                # 或 gpt-5.6-sol / gpt-5.6-luna
model_provider = "litellm-gw"
model_catalog_json = "/home/<user>/.codex/models-standard-responses.json"  # 绝对路径
approval_policy = "never"
sandbox_mode = "danger-full-access"
check_for_update_on_startup = false

[features]
remote_models = false        # 无 ChatGPT 登录态环境（如 EC2）必须关，否则连 chatgpt.com 403 卡住
plugins = false
apps = false

[model_providers.litellm-gw]
name = "LiteLLM Gateway"
base_url = "https://<cloudfront-domain>/v1"
env_key = "OPENAI_API_KEY"     # export OPENAI_API_KEY="<master-key>"
wire_api = "responses"
supports_websockets = false
request_max_retries = 1
stream_max_retries = 1
stream_idle_timeout_ms = 300000

# 验证：
#   codex exec "print exactly: OK"                       # 纯文本
#   codex exec "执行 printf hi 并只输出其 stdout"          # 真实工具调用
#   两者正常返回即成功。

